<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --zenith-primary: #00d2ff;
            --zenith-secondary: #3a7bd5;
            --zenith-accent: #00f2fe;
            --zenith-dark: #0f172a;
            --zenith-card: #1e293b;
            --zenith-text: #f8fafc;
            --zenith-muted: #94a3b8;
            --zenith-label: #cbd5e1;
        }
        body {
            background-color: var(--zenith-dark);
            color: var(--zenith-text);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }
        .form-label {
            color: var(--zenith-label) !important;
            font-weight: 600;
        }
        .form-control {
            background-color: rgba(30, 41, 59, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3) !important;
        }
        .form-control:focus {
            background-color: rgba(30, 41, 59, 1) !important;
            border-color: var(--zenith-primary) !important;
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.1) !important;
        }
        .text-muted {
            color: var(--zenith-muted) !important;
        }
        .navbar {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .text-zenith {
            background: linear-gradient(90deg, var(--zenith-primary), var(--zenith-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .btn-zenith {
            background: linear-gradient(45deg, var(--zenith-secondary), var(--zenith-primary));
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .btn-zenith:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
            color: white;
        }
        .card-system {
            background: var(--zenith-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            transform: translateZ(0); /* Stability fix */
        }
        .card-system:hover {
            transform: translateY(-10px);
            border-color: var(--zenith-primary);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .preview-container {
            position: relative;
            overflow: hidden;
            background: #000;
        }
        .preview-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
            z-index: 2;
            opacity: 0;
        }
        .preview-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 1;
        }
        .preview-video iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            cursor: pointer;
        }
        /* Se houver vídeo, a imagem aparece no hover. Se não houver, a imagem fica sempre visível. */
        .card-system:hover .preview-img {
            opacity: 1;
        }
        .card-system:hover .preview-video {
            opacity: 0;
        }
        .no-video .preview-img {
            opacity: 1;
            position: relative;
        }
        .badge-zenith {
            background: rgba(0, 210, 255, 0.1);
            color: var(--zenith-primary);
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .social-logo {
            font-size: 2rem;
            transition: all 0.3s ease;
            color: var(--zenith-muted);
        }
        .social-logo:hover {
            color: var(--zenith-primary);
            transform: scale(1.1);
        }
        .hero-section {
            padding: 100px 0;
            background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.05), transparent),
                        radial-gradient(circle at bottom left, rgba(58, 123, 213, 0.05), transparent);
        }
        
        /* Modal Stability Fix */
        body.modal-open {
            overflow: hidden !important;
            padding-right: 0 !important;
        }
        .modal {
            overflow-y: auto !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'core:portfolio' %}">ZENITH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:portfolio' %}#sobre">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:portfolio' %}#certificados">Certificados</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:portfolio' %}#portfolio">Portfólio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'core:configurador' %}">Orçamento</a></li>
                    {% if user.is_authenticated %}
                    <li class="nav-item"><a class="nav-link btn btn-sm btn-outline-info ms-lg-2" href="{% url 'core:postar_projeto' %}">Postar Projeto</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-sm btn-outline-info ms-lg-2" href="{% url 'core:postar_certificado' %}">Postar Certificado</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-sm btn-outline-warning ms-lg-2" href="{% url 'core:lead_list' %}">Leads</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
